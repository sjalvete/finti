services:
  app:
    user: "1000:1000"
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: finti-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - composer_cache:/tmp/composer
    environment:
      PHP_IDE_CONFIG: serverName=finti
      COMPOSER_HOME: /tmp/composer
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - finti

  nginx:
    image: nginx:1.27-alpine
    container_name: finti-nginx
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - finti

  mysql:
    image: mysql:8.0
    container_name: finti-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: finti
      MYSQL_USER: finti
      MYSQL_PASSWORD: finti
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - finti

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: finti-pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - finti

  node:
    image: node:22-alpine
    container_name: finti-node
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "5173:5173"
    command: sh -lc "npm install && npm run dev -- --host"
    networks:
      - finti

volumes:
  mysql_data:
  composer_cache:

networks:
  finti:
